<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 684" width="780" height="684" role="img" aria-labelledby="title description">
  <title id="title">I/O Journey storage stack</title>
  <desc id="description">In the portable capstone, the user application appends through a mock I/O ring and sends random file I/O directly to the userspace write-back cache. Both portable paths continue through the journaled filesystem and host block scheduler to the course block device. The optional Linux labs use synchronous I/O or io_uring with ext4 or FUSE. The Linux block layer can reach the same course device through ublk or use a physical disk instead. The course device consists of a queue, a flash translation layer, and simulated NAND. QEMU NVMe, SPDK, and VM virtio are planned labs.</desc>

