<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 755" width="780" height="755" role="img" aria-labelledby="title description">
  <title id="title">I/O Journey storage stack</title>
  <desc id="description">A user application appends records or reads and writes file blocks. In the portable capstone, appends pass through a mock I/O ring. Both workloads use a userspace write-back cache above a journaled filesystem. A host scheduler sends block requests to the device queue, which uses a flash translation layer and simulated NAND. The optional Linux labs use synchronous I/O or kernel io_uring, ext4 or the course filesystem through FUSE, and the Linux block layer. The ublk adapter connects these labs to the same course device queue. A physical disk is an alternative to ublk. QEMU, SPDK, and VM virtio are planned labs.</desc>

