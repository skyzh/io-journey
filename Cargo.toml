[package]
name = "io-journey"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "io-journey"

[features]
learner-nand = []
learner = ["learner-nand"]
learner-queue = ["learner"]
learner-scheduler = ["learner-queue"]
learner-cache = ["learner-scheduler"]
learner-journal = ["learner-cache"]
learner-append = ["learner-journal"]
indexed-ftl = []
learner-index = ["learner", "indexed-ftl"]
shared-pages = []
learner-sharing = ["learner", "shared-pages"]

[dependencies]

[[bin]]
name = "learner-demo"
path = "src/bin/learner-demo.rs"
required-features = ["learner-append"]
