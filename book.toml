[book]
title = "I/O Journey"
description = "Build a storage stack in Rust, from NAND flash and its translation layer through block queues, filesystems, and durable application I/O."
language = "en"
src = "course/book"

[build]
create-missing = false
extra-watch-dirs = ["course"]

[output.html]
git-repository-url = "https://github.com/skyzh/io-journey"
additional-css = ["course/sponsor.css", "course/construction-notice.css", "course/write-path.css"]
site-url = "/io-journey/"
