name: Deploy mdBook to Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages book
    if: ${{ github.ref == 'refs/heads/main' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the book with mdBook 0.5.4
        shell: bash
        run: |
          archive=mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/$archive"
          printf '%s  %s\n' 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7 \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mdbook
          export PATH="$RUNNER_TEMP:$PATH"
          mdbook --version
          mdbook build
          test -s book/index.html
      - name: Upload generated book
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: book

  deploy:
    name: Deploy book
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify repository is still public
        shell: bash
        run: |
          curl --disable --fail --silent --show-error --max-time 15 \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" |
            jq -e --arg repository "$GITHUB_REPOSITORY" \
              '.full_name == $repository and .private == false and .visibility == "public"' >/dev/null
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
